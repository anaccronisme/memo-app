<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mémo</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --glass-shadow: rgba(0, 0, 0, 0.1);
            --text-primary: rgba(0, 0, 0, 0.85);
            --text-secondary: rgba(0, 0, 0, 0.55);
            --accent: rgba(255, 204, 0, 1);
            --accent-glass: rgba(255, 204, 0, 0.25);
            --success: rgba(52, 199, 89, 0.9);
            --error: rgba(255, 59, 48, 0.9);
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(40, 40, 45, 0.65);
                --glass-border: rgba(255, 255, 255, 0.15);
                --glass-highlight: rgba(255, 255, 255, 0.1);
                --glass-shadow: rgba(0, 0, 0, 0.4);
                --text-primary: rgba(255, 255, 255, 0.92);
                --text-secondary: rgba(255, 255, 255, 0.55);
                --accent: rgba(255, 214, 10, 1);
                --accent-glass: rgba(255, 214, 10, 0.3);
            }
        }
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(255, 180, 150, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(150, 180, 255, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(200, 150, 255, 0.3) 0%, transparent 60%),
                linear-gradient(145deg, #e8e0f0 0%, #d0e8f0 50%, #f0e0e8 100%);
            background-attachment: fixed;
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                background: 
                    radial-gradient(ellipse at 20% 20%, rgba(100, 60, 80, 0.5) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 80%, rgba(40, 60, 100, 0.5) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 50%, rgba(60, 40, 80, 0.4) 0%, transparent 60%),
                    linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            }
        }
        
        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border-radius: 28px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 
                0 8px 32px var(--glass-shadow),
                inset 0 1px 0 var(--glass-highlight),
                inset 0 -1px 0 rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.15) 0%,
                rgba(255, 255, 255, 0.05) 40%,
                transparent 100%
            );
            border-radius: 28px 28px 0 0;
            pointer-events: none;
        }
        
        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 24px;
        }
        
        h1 {
            margin: 0 0 6px 0;
            font-family: 'New York', 'New York Large', ui-serif, Georgia, serif;
            font-size: 32px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        
        .date {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
        }
        
        .type-selector {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .type-btn {
            position: relative;
            flex: 1;
            padding: 12px 20px;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        @media (prefers-color-scheme: dark) {
            .type-btn {
                background: rgba(255, 255, 255, 0.08);
            }
        }
        
        .type-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, transparent 100%);
            border-radius: 16px 16px 0 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .type-btn:hover::before {
            opacity: 1;
        }
        
        .type-btn.active {
            background: var(--accent-glass);
            border-color: var(--accent);
            color: rgba(0, 0, 0, 0.8);
            box-shadow: 
                0 4px 16px rgba(255, 204, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        
        .type-btn.active::before {
            opacity: 1;
        }
        
        .input-group {
            position: relative;
            z-index: 1;
        }
        
        .url-input {
            display: none;
            margin-bottom: 14px;
        }
        
        .url-input.visible {
            display: block;
        }
        
        .url-input input,
        textarea {
            width: 100%;
            padding: 16px 18px;
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 16px;
            font-family: inherit;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        
        @media (prefers-color-scheme: dark) {
            .url-input input,
            textarea {
                background: rgba(255, 255, 255, 0.08);
            }
        }
        
        textarea {
            height: 140px;
            resize: none;
            line-height: 1.5;
        }
        
        .url-input input::placeholder,
        textarea::placeholder {
            color: var(--text-secondary);
        }
        
        .url-input input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 0 0 4px rgba(255, 204, 0, 0.15),
                inset 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        
        @media (prefers-color-scheme: dark) {
            .url-input input:focus,
            textarea:focus {
                background: rgba(255, 255, 255, 0.12);
            }
        }
        
        .button-row {
            position: relative;
            z-index: 1;
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        
        button.action-btn {
            position: relative;
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        button.action-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
            border-radius: 18px 18px 0 0;
            pointer-events: none;
        }
        
        button.action-btn:active {
            transform: scale(0.97);
        }
        
        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-primary {
            background: linear-gradient(180deg, #FFD60A 0%, #FFCC00 100%);
            color: rgba(0, 0, 0, 0.85);
            box-shadow: 
                0 4px 16px rgba(255, 204, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        
        .btn-primary:hover {
            box-shadow: 
                0 6px 24px rgba(255, 204, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        
        .btn-notion {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }
        
        @media (prefers-color-scheme: dark) {
            .btn-notion {
                background: rgba(255, 255, 255, 0.1);
            }
        }
        
        .btn-notion:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        
        .status {
            position: relative;
            z-index: 1;
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .status.success {
            background: rgba(52, 199, 89, 0.2);
            border: 1px solid rgba(52, 199, 89, 0.4);
            color: var(--success);
            display: block;
        }
        
        .status.error {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--error);
            display: block;
        }
        
        .status.loading {
            background: var(--accent-glass);
            border: 1px solid rgba(255, 204, 0, 0.4);
            color: rgba(0, 0, 0, 0.8);
            display: block;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        .status.loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 14px;
            pointer-events: none;
        }
        
        @supports (padding: max(0px)) {
            body {
                padding-left: max(20px, env(safe-area-inset-left));
                padding-right: max(20px, env(safe-area-inset-right));
                padding-top: max(20px, env(safe-area-inset-top));
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Mémo</h1>
            <div class="date" id="dateDisplay"></div>
        </div>
        
        <div class="type-selector">
            <button class="type-btn active" data-type="text">Texte</button>
            <button class="type-btn" data-type="link">Lien</button>
        </div>
        
        <div class="input-group">
            <div class="url-input" id="urlInput">
                <input type="url" id="linkUrl" placeholder="https://...">
            </div>
            
            <textarea id="content" placeholder="Qu'est-ce que tu veux noter ?"></textarea>
        </div>
        
        <div class="button-row">
            <button class="action-btn btn-primary" id="sendBtn" onclick="sendToNotion()">Envoyer</button>
        </div>
        
        <div class="button-row">
            <button class="action-btn btn-notion" onclick="openInNotion()">Ouvrir dans Notion</button>
        </div>
        
        <div class="status" id="status"></div>
    </div>

    <script>
        const joursFr = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
        
        let currentType = 'text';
        let currentPageId = null;
        
        function getTodayTitle() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const jourSemaine = joursFr[now.getDay()];
            return `${year}-${month}-${day}-${jourSemaine}`;
        }
        
        function getDisplayDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return now.toLocaleDateString('fr-FR', options);
        }
        
        document.getElementById('dateDisplay').textContent = getDisplayDate();
        
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                
                const urlInput = document.getElementById('urlInput');
                const textarea = document.getElementById('content');
                
                if (currentType === 'link') {
                    urlInput.classList.add('visible');
                    textarea.placeholder = 'Description du lien (optionnel)';
                } else {
                    urlInput.classList.remove('visible');
                    textarea.placeholder = "Qu'est-ce que tu veux noter ?";
                }
            });
        });
        
        async function callAPI(body) {
            const response = await fetch('/api/notion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return response.json();
        }
        
        async function sendToNotion() {
            const content = document.getElementById('content').value.trim();
            const linkUrl = document.getElementById('linkUrl').value.trim();
            const statusEl = document.getElementById('status');
            const sendBtn = document.getElementById('sendBtn');
            
            if (!content && currentType === 'text') {
                statusEl.className = 'status error';
                statusEl.textContent = 'Écris quelque chose à noter !';
                return;
            }
            
            if (currentType === 'link' && !linkUrl) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Ajoute une URL !';
                return;
            }
            
            sendBtn.disabled = true;
            statusEl.className = 'status loading';
            statusEl.textContent = 'Envoi en cours...';
            
            try {
                const title = getTodayTitle();
                
                // Find today's page
                let result = await callAPI({ action: 'findPage', title });

                if (result.error) {
                    throw new Error(result.message || result.error);
                }

                let pageId = result.pageId;

                // Create if doesn't exist
                if (!pageId) {
                    statusEl.textContent = 'Création de la note du jour...';
                    result = await callAPI({ action: 'createPage', title });

                    if (result.error) {
                        throw new Error(result.message || result.error);
                    }

                    pageId = result.pageId;
                }

                if (!pageId) {
                    throw new Error('Impossible de créer la page');
                }

                currentPageId = pageId;
                
                // Append content
                result = await callAPI({
                    action: 'appendContent',
                    pageId,
                    content,
                    type: currentType,
                    url: linkUrl
                });
                
                if (result.success) {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✓ Ajouté à ta note du jour';
                    document.getElementById('content').value = '';
                    document.getElementById('linkUrl').value = '';
                } else {
                    throw new Error(result.error?.message || 'Échec de l\'ajout');
                }
            } catch (error) {
                console.error(error);
                statusEl.className = 'status error';
                statusEl.textContent = 'Erreur : ' + error.message;
            }
            
            sendBtn.disabled = false;
        }
        
        async function openInNotion() {
            const title = getTodayTitle();
            let pageId = currentPageId;
            
            if (!pageId) {
                const result = await callAPI({ action: 'findPage', title });
                pageId = result.pageId;
            }
            
            if (pageId) {
                const cleanId = pageId.replace(/-/g, '');
                window.open(`https://notion.so/${cleanId}`, '_blank');
            } else {
                const statusEl = document.getElementById('status');
                statusEl.className = 'status error';
                statusEl.textContent = 'Pas de note pour aujourd\'hui. Envoie quelque chose d\'abord !';
            }
        }
        
        document.getElementById('content').focus();
    </script>
</body>
</html>
