<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Note du jour">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>Note du jour</title>
    <style>
        :root {
            /* Liquid Glass - Light Mode */
            --glass-bg: rgba(255, 255, 255, 0.42);
            --glass-border: rgba(255, 255, 255, 0.55);
            --glass-highlight: rgba(255, 255, 255, 0.7);
            --glass-shadow: rgba(0, 0, 0, 0.08);
            --text-primary: rgba(0, 0, 0, 0.88);
            --text-secondary: rgba(0, 0, 0, 0.5);
            --accent: rgba(255, 204, 0, 1);
            --accent-glass: rgba(255, 204, 0, 0.22);
            --success: rgba(52, 199, 89, 0.9);
            --error: rgba(255, 59, 48, 0.9);

            /* Liquid Glass spacing & radii */
            --radius-container: 44px;
            --radius-control: 50px;
            --radius-input: 24px;
            --spacing-lg: 20px;
            --spacing-md: 16px;
            --spacing-sm: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --glass-bg: rgba(38, 38, 42, 0.62);
                --glass-border: rgba(255, 255, 255, 0.12);
                --glass-highlight: rgba(255, 255, 255, 0.08);
                --glass-shadow: rgba(0, 0, 0, 0.35);
                --text-primary: rgba(255, 255, 255, 0.92);
                --text-secondary: rgba(255, 255, 255, 0.5);
                --accent: rgba(255, 214, 10, 1);
                --accent-glass: rgba(255, 214, 10, 0.25);
                --success: rgba(50, 215, 75, 1);
                --error: rgba(255, 69, 58, 1);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            background-color: #e8e0f0;
        }

        html::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-color: #e8e0f0;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(255, 180, 150, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(150, 180, 255, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(200, 150, 255, 0.3) 0%, transparent 60%),
                linear-gradient(145deg, #e8e0f0 0%, #d0e8f0 50%, #f0e0e8 100%);
        }

        @media (prefers-color-scheme: dark) {
            html {
                background-color: #1a1a2e;
            }

            html::before {
                background-color: #1a1a2e;
                background-image:
                    radial-gradient(ellipse at 20% 20%, rgba(100, 60, 80, 0.5) 0%, transparent 50%),
                    radial-gradient(ellipse at 80% 80%, rgba(40, 60, 100, 0.5) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 50%, rgba(60, 40, 80, 0.4) 0%, transparent 60%),
                    linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border-radius: var(--radius-container);
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(190%);
            -webkit-backdrop-filter: blur(50px) saturate(190%);
            border: 0.5px solid var(--glass-border);
            box-shadow:
                0 12px 40px var(--glass-shadow),
                0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.12) 0%,
                rgba(255, 255, 255, 0.04) 50%,
                transparent 100%
            );
            border-radius: var(--radius-container) var(--radius-container) 0 0;
            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 28px;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px 0;
            font-family: 'New York', 'New York Large', ui-serif, Georgia, serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .date {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        /* Type selector - Liquid Glass capsule style */
        .type-selector {
            position: relative;
            z-index: 1;
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
            padding: 4px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: var(--radius-control);
        }

        @media (prefers-color-scheme: dark) {
            .type-selector {
                background: rgba(255, 255, 255, 0.04);
            }
        }

        .type-btn {
            position: relative;
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: calc(var(--radius-control) - 4px);
            background: transparent;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .type-btn:hover {
            color: var(--text-primary);
        }

        .type-btn.active {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            color: var(--text-primary);
            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.08),
                0 0 0 0.5px rgba(255, 255, 255, 0.2) inset;
        }

        .input-group {
            position: relative;
            z-index: 1;
        }

        .url-input {
            display: none;
            margin-bottom: var(--spacing-md);
        }

        .url-input.visible {
            display: block;
        }

        .url-input input,
        textarea {
            width: 100%;
            padding: 18px 22px;
            border: 0.5px solid var(--glass-border);
            border-radius: var(--radius-input);
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            font-size: 17px;
            font-family: inherit;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (prefers-color-scheme: dark) {
            .url-input input,
            textarea {
                background: rgba(255, 255, 255, 0.06);
            }
        }

        textarea {
            height: 130px;
            resize: none;
            line-height: 1.55;
        }

        .url-input input::placeholder,
        textarea::placeholder {
            color: var(--text-secondary);
        }

        .url-input input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 0 4px rgba(255, 204, 0, 0.12);
        }

        @media (prefers-color-scheme: dark) {
            .url-input input:focus,
            textarea:focus {
                background: rgba(255, 255, 255, 0.1);
            }
        }

        /* Button rows - Liquid Glass */
        .button-row {
            position: relative;
            z-index: 1;
            display: flex;
            gap: var(--spacing-sm);
            margin-top: var(--spacing-lg);
        }

        button.action-btn {
            position: relative;
            flex: 1;
            padding: 18px 28px;
            border: none;
            border-radius: var(--radius-control);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        button.action-btn:active {
            transform: scale(0.96);
        }

        button.action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Primary button - Prominent Liquid Glass style */
        .btn-primary {
            background: linear-gradient(180deg, #FFD60A 0%, #FFCC00 100%);
            color: rgba(0, 0, 0, 0.88);
            box-shadow:
                0 6px 24px rgba(255, 204, 0, 0.35),
                0 0 0 0.5px rgba(255, 255, 255, 0.3) inset;
        }

        @media (prefers-color-scheme: dark) {
            .btn-primary {
                background: linear-gradient(180deg, #FFD60A 0%, #FFCC00 100%);
                color: rgba(0, 0, 0, 0.9);
            }
        }

        .btn-primary:hover {
            box-shadow:
                0 8px 32px rgba(255, 204, 0, 0.45),
                0 0 0 0.5px rgba(255, 255, 255, 0.3) inset;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: scale(0.96) translateY(0);
        }

        /* Status - Liquid Glass style */
        .status {
            position: relative;
            z-index: 1;
            margin-top: var(--spacing-lg);
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            text-align: center;
        }

        .status.success {
            background: rgba(255, 214, 10, 0.12);
            border: 0.5px solid rgba(255, 214, 10, 0.35);
            color: var(--accent);
            display: block;
        }

        .status.error {
            background: rgba(255, 59, 48, 0.1);
            border: 0.5px solid rgba(255, 59, 48, 0.25);
            color: var(--error);
            display: block;
        }

        .status.loading {
            background: var(--accent-glass);
            border: 0.5px solid rgba(255, 204, 0, 0.35);
            color: var(--text-primary);
            display: block;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .status.loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.08) 50%,
                transparent 100%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 20px;
            pointer-events: none;
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(24px, env(safe-area-inset-left));
                padding-right: max(24px, env(safe-area-inset-right));
                padding-top: max(24px, env(safe-area-inset-top));
                padding-bottom: max(24px, env(safe-area-inset-bottom));
            }
        }

        /* Secondary actions - Liquid Glass grouped */
        .secondary-actions {
            gap: var(--spacing-sm);
            margin-top: var(--spacing-md);
        }

        .btn-secondary {
            flex: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            color: var(--text-primary);
            border: 0.5px solid var(--glass-border);
            font-size: 15px;
            padding: 14px 20px;
            box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.1) inset;
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary {
                background: rgba(255, 255, 255, 0.06);
            }
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        @media (prefers-color-scheme: dark) {
            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }

        .btn-secondary.recording {
            background: var(--accent-glass);
            border-color: var(--accent);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.75; }
        }

        .notion-link {
            position: relative;
            z-index: 1;
            display: block;
            margin-top: var(--spacing-lg);
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .notion-link:hover {
            color: var(--text-primary);
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Note du jour</h1>
            <div class="date" id="dateDisplay"></div>
        </div>
        
        <div class="type-selector">
            <button class="type-btn active" data-type="text">Texte</button>
            <button class="type-btn" data-type="link">Lien</button>
        </div>
        
        <div class="input-group">
            <div class="url-input" id="urlInput">
                <input type="url" id="linkUrl" placeholder="https://...">
            </div>
            
            <textarea id="content" placeholder="Qu'est-ce qui te passe par la tête ?" autofocus enterkeyhint="send"></textarea>
        </div>
        
        <div class="button-row">
            <button class="action-btn btn-primary" id="sendBtn" onclick="sendToNotion()">Envoyer</button>
        </div>

        <div class="button-row secondary-actions">
            <button class="action-btn btn-secondary" id="dictateBtn" onclick="toggleDictation()">Dicter</button>
            <button class="action-btn btn-secondary" id="fileBtn" onclick="selectFile()">Fichier</button>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">

        <div class="status" id="status"></div>

        <a href="#" class="notion-link" id="notionLink" onclick="openInNotion(); return false;">Ouvrir dans Notion</a>
    </div>

    <script>
        const joursFr = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
        
        let currentType = 'text';
        let currentPageId = null;
        let isRecording = false;
        let isVoiceInput = false;
        let recognition = null;

        // Speech Recognition setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalTranscript += transcript;
                    } else {
                        interimTranscript = transcript;
                    }
                }

                const textarea = document.getElementById('content');
                if (finalTranscript) {
                    textarea.value += finalTranscript + ' ';
                    isVoiceInput = true;
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                stopDictation();
            };

            recognition.onend = () => {
                if (isRecording) {
                    recognition.start();
                }
            };
        }

        function toggleDictation() {
            if (!recognition) {
                alert('La reconnaissance vocale n\'est pas supportée sur ce navigateur.');
                return;
            }

            if (isRecording) {
                stopDictation();
            } else {
                startDictation();
            }
        }

        function startDictation() {
            isRecording = true;
            recognition.start();
            const btn = document.getElementById('dictateBtn');
            btn.classList.add('recording');
            btn.textContent = 'Stop';
        }

        function stopDictation() {
            isRecording = false;
            recognition.stop();
            const btn = document.getElementById('dictateBtn');
            btn.classList.remove('recording');
            btn.textContent = 'Dicter';
        }

        function selectFile() {
            document.getElementById('fileInput').click();
        }

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status');
            statusEl.className = 'status loading';
            statusEl.textContent = 'Upload en cours...';

            try {
                // Convert to base64
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });

                // Upload via backend
                const title = getTodayTitle();
                const result = await callAPI({
                    action: 'uploadImage',
                    title,
                    imageData: base64,
                    filename: file.name
                });

                if (result.success) {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✓ Image ajoutée';
                } else {
                    throw new Error(result.error?.message || 'Échec de l\'ajout');
                }
            } catch (error) {
                console.error(error);
                statusEl.className = 'status error';
                statusEl.textContent = 'Erreur : ' + error.message;
            }

            event.target.value = '';
        }

        function getTodayTitle() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const jourSemaine = joursFr[now.getDay()];
            return `${year}-${month}-${day}-${jourSemaine}`;
        }
        
        function getDisplayDate() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return now.toLocaleDateString('fr-FR', options);
        }
        
        document.getElementById('dateDisplay').textContent = getDisplayDate();
        
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.type;
                
                const urlInput = document.getElementById('urlInput');
                const textarea = document.getElementById('content');
                
                if (currentType === 'link') {
                    urlInput.classList.add('visible');
                    textarea.placeholder = 'Description du lien (optionnel)';
                } else {
                    urlInput.classList.remove('visible');
                    textarea.placeholder = "Qu'est-ce qui te passe par la tête ?";
                }
            });
        });
        
        async function callAPI(body) {
            const response = await fetch('/api/notion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            return response.json();
        }
        
        async function sendToNotion() {
            const content = document.getElementById('content').value.trim();
            const linkUrl = document.getElementById('linkUrl').value.trim();
            const statusEl = document.getElementById('status');
            const sendBtn = document.getElementById('sendBtn');
            
            if (!content && currentType === 'text') {
                statusEl.className = 'status error';
                statusEl.textContent = 'Écris quelque chose à noter !';
                return;
            }
            
            if (currentType === 'link' && !linkUrl) {
                statusEl.className = 'status error';
                statusEl.textContent = 'Ajoute une URL !';
                return;
            }
            
            sendBtn.disabled = true;
            statusEl.className = 'status loading';
            statusEl.textContent = 'Envoi en cours...';
            
            try {
                const title = getTodayTitle();
                
                // Find today's page
                let result = await callAPI({ action: 'findPage', title });

                if (result.error) {
                    throw new Error(result.message || result.error);
                }

                let pageId = result.pageId;

                // Create if doesn't exist
                if (!pageId) {
                    statusEl.textContent = 'Création de la note du jour...';
                    result = await callAPI({ action: 'createPage', title });

                    if (result.error) {
                        throw new Error(result.message || result.error);
                    }

                    pageId = result.pageId;
                }

                if (!pageId) {
                    throw new Error('Impossible de créer la page');
                }

                currentPageId = pageId;
                
                // Append content
                const sendType = (isVoiceInput && currentType === 'text') ? 'voice' : currentType;
                result = await callAPI({
                    action: 'appendContent',
                    pageId,
                    content,
                    type: sendType,
                    url: linkUrl
                });

                if (result.success) {
                    statusEl.className = 'status success';
                    statusEl.textContent = '✓ Ajouté à ta note du jour';
                    document.getElementById('content').value = '';
                    document.getElementById('linkUrl').value = '';
                    isVoiceInput = false;
                } else {
                    throw new Error(result.error?.message || 'Échec de l\'ajout');
                }
            } catch (error) {
                console.error(error);
                statusEl.className = 'status error';
                statusEl.textContent = 'Erreur : ' + error.message;
            }
            
            sendBtn.disabled = false;
        }
        
        async function openInNotion() {
            const title = getTodayTitle();
            const statusEl = document.getElementById('status');
            let pageId = currentPageId;

            if (!pageId) {
                statusEl.className = 'status loading';
                statusEl.textContent = 'Recherche...';
                const result = await callAPI({ action: 'findPage', title });
                pageId = result.pageId;
                statusEl.className = 'status';
                statusEl.textContent = '';
            }

            if (pageId) {
                const cleanId = pageId.replace(/-/g, '');
                window.location.href = `https://notion.so/${cleanId}`;
            } else {
                statusEl.className = 'status error';
                statusEl.textContent = 'Pas de note pour aujourd\'hui. Envoie quelque chose d\'abord !';
            }
        }
        
        // Send on Enter key (without Shift)
        document.getElementById('content').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendToNotion();
            } else {
                // User is typing manually, reset voice flag
                isVoiceInput = false;
            }
        });

        document.getElementById('content').focus();
    </script>
</body>
</html>
